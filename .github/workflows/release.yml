name: Release

on:
  push:
    # 런북(docs/runbooks/release.md)의 semver 태그만 매칭 — 실험용 태그로 릴리스가 생기지 않도록
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # deploy.yml과 같은 이유로 액션을 커밋 SHA로 고정한다
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # 런북 규칙 강제: main에 없는 커밋으로는 릴리스를 만들지 않는다.
      # annotated 태그에서는 GITHUB_SHA가 태그 객체를 가리킬 수 있어 태그 이름을 커밋으로 풀어 검사한다.
      # actions/checkout은 태그 푸시 때 태그를 커밋을 가리키는 lightweight로 다시 만든다. 그러면 아래 %(contents)가
      # 태그 메시지 대신 머지 커밋 메시지를 읽어 요약이 틀리게 들어간다 (v2.0.0~v2.14.0 수동 교정, BY-1217).
      # 원격의 annotated 태그 객체를 강제로 다시 받아 덮어쓴다.
      # 그 사이 태그가 다시 만들어졌으면 이 실행을 일으킨 커밋과 달라지므로 중단한다.
      - name: Fetch annotated tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" != "$(git rev-parse "${GITHUB_SHA}^{commit}")" ]; then
            echo "::error::원격 태그 ${GITHUB_REF_NAME}이(가) 이 실행의 커밋(${GITHUB_SHA})과 다릅니다. 태그가 다시 만들어졌는지 확인하세요."
            exit 1
          fi

      - name: Verify tag commit is on main
        run: |
          git fetch origin main --quiet
          commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::태그 커밋($commit)이 main에 없습니다. docs/runbooks/release.md대로 main에서 태그하세요."
            exit 1
          fi

      # 사람이 쓴 태그 메시지(요약)를 릴리스 본문 맨 위에 넣고, 그 아래에 GitHub 자동 PR 목록을 붙인다.
      # lightweight 태그면 메시지가 비어 자동 목록만 들어간다.
      # 재실행 멱등성: 이미 릴리스가 있으면 성공으로 종료 (워크플로 재시도/중복 이벤트 대비)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "릴리스 $GITHUB_REF_NAME 이(가) 이미 있어 건너뜁니다"
            exit 0
          fi
          summary="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::warning::$GITHUB_REF_NAME 이(가) annotated 태그가 아니라 요약 없이 자동 목록만 넣습니다"
            summary=""
          fi
          # 제목을 주지 않으면 gh가 태그 커밋 메시지(머지 커밋 제목)를 제목으로 쓴다
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes --notes "${summary}"$'\n'   # 요약과 자동 목록 사이 빈 줄
