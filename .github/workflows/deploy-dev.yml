name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch: # 재배포·검증용 수동 실행

# 이미지를 GHCR에 올리고(packages: write), 서버가 그 이미지를 받는다(같은 GITHUB_TOKEN을 일회성으로 전달)
permissions:
  contents: read
  packages: write

# dev에 연속으로 push되면 늦게 시작한 배포가 먼저 끝나 이전 코드로 덮어쓸 수 있다 — 큐로 순서대로만 배포한다
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/breathless-youth/backend-dev

jobs:
  deploy:
    # dev 서버(Oracle E2.1.Micro)는 x86_64라 amd64 러너에서 그대로 빌드한다
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        env:
          DEV_APP_HOST: ${{ vars.DEV_APP_HOST }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ vars.DEV_SSH_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          : "${DEV_APP_HOST:?DEV_APP_HOST 저장소 변수가 비어 있다}"
          : "${DEV_SSH_KEY:?DEV_SSH_KEY 시크릿이 비어 있다}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/dev_key && chmod 600 ~/.ssh/dev_key
          # 호스트 키는 저장소 변수로 고정한다(첫 접속 신뢰 방지). 변수가 없으면 실패시킨다
          : "${DEV_SSH_KNOWN_HOSTS:?DEV_SSH_KNOWN_HOSTS 저장소 변수가 비어 있다}"
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/dev_key -o IdentitiesOnly=yes -o ServerAliveInterval=15 ubuntu@$DEV_APP_HOST"
          scp -i ~/.ssh/dev_key -o IdentitiesOnly=yes docker-compose.dev-app.yml "ubuntu@$DEV_APP_HOST:/home/ubuntu/app-dev/docker-compose.yml"
          # 토큰은 명령줄이 아니라 원격 셸의 환경으로만 넘긴다(스크립트는 stdin)
          $SSH "GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='$GHCR_USER' sh -s -- '$IMAGE_NAME:$GITHUB_SHA'" < .github/scripts/deploy-dev.sh
