name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch: # 재배포·검증용 수동 실행

env:
  AWS_REGION: ap-northeast-2

# OIDC로 AWS 자격 증명을 받기 위해 필요하다 (액세스 키를 저장하지 않는다)
permissions:
  id-token: write
  contents: read

# dev에 연속으로 push되면 늦게 시작한 배포가 먼저 끝나 이전 코드로 덮어쓸 수 있다.
# 새 실행은 큐에 세워 순서대로만 배포한다 (진행 중 취소는 compose 교체 도중 끊길 수 있어 쓰지 않는다)
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    # 빌드는 서버에서 하므로 러너 아키텍처는 무관하다
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INSTANCE_ID: ${{ vars.DEV_INSTANCE_ID }}
    steps:
      # 액션은 id-token: write로 AWS 자격을 얻는 워크플로라 커밋 SHA로 고정한다 (운영 deploy.yml과 같은 SHA)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command (SSM)
        id: send
        run: |
          : "${INSTANCE_ID:?DEV_INSTANCE_ID 저장소 변수가 비어 있다}"
          # 스크립트 파일 전체를 commands 배열의 한 원소로 넘긴다 — jq가 줄바꿈·따옴표를 이스케이프한다
          PARAMS=$(jq -n --rawfile script .github/scripts/deploy-dev.sh \
            '{commands: [$script], executionTimeout: ["1800"]}')
          # --timeout-seconds: 에이전트가 오프라인이면 기본 3600초 동안 Pending에 머문다 — 10분이면 TimedOut으로 드러나게 한다
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --comment "deploy-dev ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for completion
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          # 배달 대기(--timeout-seconds 600) + 실행(executionTimeout 1800)보다 긴 2,500초(250×10초)까지 기다린다 —
          # 폴링이 원격 실행보다 먼저 끝나면 concurrency 그룹이 풀려 다음 배포와 겹친다.
          # 전송 직후 몇 초는 InvocationDoesNotExist가 나므로 처음 6회만 오류를 Pending으로 보고,
          # 그 뒤의 오류(AccessDenied·Throttling 등)는 40분 뒤가 아니라 즉시 실패시킨다
          for i in $(seq 1 250); do
            if STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query Status --output text 2>invocation-error.txt); then
              :
            elif [ "$i" -le 6 ]; then
              STATUS=Pending
            else
              cat invocation-error.txt
              exit 1
            fi
            case "$STATUS" in
              # Cancelling은 곧 Cancelled로 바뀌는 비종료 상태라 함께 기다린다
              Pending|InProgress|Delayed|Cancelling) sleep 10 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status: Status, Out: StandardOutputContent, Err: StandardErrorContent}' \
            --output json > result.json
          echo "::group::server stdout"; jq -r '.Out' result.json; echo "::endgroup::"
          echo "::group::server stderr"; jq -r '.Err' result.json; echo "::endgroup::"
          FINAL=$(jq -r '.Status' result.json)
          echo "SSM status: $FINAL"
          [ "$FINAL" = "Success" ] || exit 1
