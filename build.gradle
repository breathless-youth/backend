plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '7.0.4'
}

group = 'project'
version = 'v2.8.2'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	querydslVersion = '7.4.0'
}

dependencies {
	// --- Web / API ---
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// --- Security / 인증 ---
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.13.0' // jjwt-jackson 대신 (Jackson 3 충돌 회피)

	// --- 모니터링 ---
	// Boot 4 전용 모듈이다. sentry-spring-boot-starter-jakarta는 Boot 3용이라 여기선 동작하지 않는다.
	// Boot 4 BOM이 Sentry 버전을 관리하지 않아 버전 명시가 필요하다.
	implementation 'io.sentry:sentry-spring-boot-4:8.51.0'

	// --- 푸시 ---
	// 서버 직접 FCM 발송 (ADR-0035). Jackson 3(tools.jackson)와는 패키지가 달라 부딪히지 않는다.
	// 메시징만 쓰지만 Firestore·Cloud Storage를 빼면 FirebaseOptions가 기본으로 쓰는 jackson2 JsonFactory까지 빠져
	// 초기화에서 NoClassDefFoundError가 난다 — 그래서 통째로 받는다.
	implementation 'com.google.firebase:firebase-admin:9.11.0'

	// --- 파일 저장 (S3) ---
	// 프로필 사진 업로드 URL 발급·확인·삭제. Boot BOM이 AWS SDK를 관리하지 않아 SDK BOM으로 버전을 맞춘다
	implementation platform('software.amazon.awssdk:bom:2.56.0')
	implementation 'software.amazon.awssdk:s3'

	// --- 데이터 / DB ---
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	runtimeOnly 'org.postgresql:postgresql'

	// 바인딩 파라미터가 채워진 실제 실행 SQL을 로깅한다 (hibernate show-sql은 '?'만 찍음).
	// classpath에는 항상 있지만 prod 프로파일에서 decorator.datasource.enabled=false로 꺼둔다.
	// v2.0.x가 Spring Boot 4 대응 버전이다 (2.0.0 "Prepare for Spring Boot 4").
	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:2.0.1'

	// --- 코드 생성 / 유틸 ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// ===== 테스트 =====
	// --- 테스트 스타터 (각 스타터의 테스트 대응 모듈) ---
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

	// --- 통합 테스트 / 실제 DB ---
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'

	// --- API 테스트 / 아키텍처 검증 ---
	testImplementation 'io.rest-assured:rest-assured:6.0.1'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'

	// --- 코드 생성 / 유틸 (테스트) ---
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'failed', 'skipped'
	}
}

spotless {
	java {
		palantirJavaFormat('2.96.0')
		removeUnusedImports()
		importOrder()
	}
}

checkstyle {
	toolVersion = '10.21.0'
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 0
}
