# 테스트 전용 설정: @SpringBootTest 컨텍스트 기동에 필요한 최소값
oauth:
  google:
    client-ids: test-google-client-id
  kakao:
    app-keys: test-kakao-app-key
  apple:
    bundle-ids: test-apple-bundle-id
    services-id: ""
    team-id: ""
    key-id: ""
    private-key: ""
    web-redirect-uri: ""
    android-callback-redirect: ""

jwt:
  secret: test-secret-key-that-is-at-least-32-chars-long
  access-expiration: 3600000

refresh-token:
  expiration: 1209600000

# BY-447 확정 스케줄러 — 테스트에서는 끈다 (백그라운드 확정이 테스트 데이터를 건드리는 경합 방지)
session-finalize:
  enabled: false

# BY-626 태스크 리스 — 테스트는 관찰 기간 없이 바로 회수 판정이 가능하게 한다 (운영 기본 30초)
app:
  # BY-1241 공부 포인트 시작 날짜 — 테스트는 지난 날짜의 세션으로 지급을 확인한다
  points:
    study:
      starts-on: 2026-01-01
  room:
    # 룸 정리 스케줄러는 테스트에서 끈다 — 5초마다 도는 백그라운드 스윕이 테스트가 커밋한 행을 건드리는 경합 방지
    cleanup:
      enabled: false
    lease:
      observation-seconds: 0
  # BY-1124 그룹 스케줄러(신청 만료 등) — 테스트는 서비스 메서드를 직접 부른다 (백그라운드 만료가 테스트 데이터를 건드리는 경합 방지)
  group:
    scheduler:
      enabled: false
  # BY-828 랭킹 마감 스케줄러 — 테스트는 RankingCloser.closeDue를 직접 부른다 (매분 백그라운드 마감이 테스트 데이터를 건드리는 경합 방지)
  ranking:
    close:
      enabled: false
  # 테스트는 S3를 부르지 않는다. 서명 테스트는 고정 자격 증명, API 테스트는 ProfileImageStorage 목을 쓴다
  profile-image:
    bucket: test-avatars
    region: ap-northeast-2
    base-url: ""
