# 테스트 전용 설정: @SpringBootTest 컨텍스트 기동에 필요한 최소값
oauth:
  google:
    client-id: test-google-client-id
  kakao:
    app-key: test-kakao-app-key
  apple:
    client-id: test-apple-client-id

jwt:
  secret: test-secret-key-that-is-at-least-32-chars-long
  access-expiration: 3600000

refresh-token:
  expiration: 1209600000

# BY-447 확정 스케줄러 — 테스트에서는 끈다 (백그라운드 확정이 테스트 데이터를 건드리는 경합 방지)
session-finalize:
  enabled: false

# BY-626 태스크 리스 — 테스트는 관찰 기간 없이 바로 회수 판정이 가능하게 한다 (운영 기본 30초)
app:
  room:
    lease:
      observation-seconds: 0
